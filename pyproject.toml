[project]
name = "magris"
version = "0.0.0"
description = "Benchmarking streaming architectures for IoT-based slope monitoring"
requires-python = ">=3.11"
readme = "README.md"

# Runtime deps are tracked in requirements.txt while the component set is in
# flux; expected to migrate here (with a lockfile) once it stabilizes.
# Current: pydantic, aiomqtt, asyncpg (+ pytest for dev). Kafka variants will
# add aiokafka; the API will add fastapi/uvicorn.
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["common", "loadgen", "consumers", "bench"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
