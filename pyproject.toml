[project]
name = "slope-monitoring"
version = "1.0.0"
description = "Backend + ML pipeline for slope and drill-and-blast monitoring (UI-ITB-BRIN)"
requires-python = ">=3.11"
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "services", "ml", "data"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
